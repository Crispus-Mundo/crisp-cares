<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect Members | CMCC Training Institute</title>
<meta name="description" content="Your job board, job tracker, resume builder, license wallet, hours log, refreshers and practice quizzes.">
<meta name="theme-color" content="#1B2951">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Connect">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2951;--ink:#121C38;--gold:#C9A961;--gold-wash:#F1E7CF;--cream:#FAF7F0;--paper:#FFFDF8;--muted:#586079;--line:#E4DCC8;--ok:#1E7B4A;--warn:#9A5B00;--bad:#A3271B}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:90px}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:var(--cream);position:sticky;top:0;z-index:30}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:10px}
.mark{display:flex;align-items:center;gap:8px;font:600 14px/1 Cinzel,Georgia,serif;letter-spacing:.08em;color:var(--gold);text-decoration:none}
.mark svg{width:26px;height:26px}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--gold-wash);color:#5C4A1E;font-weight:600;white-space:nowrap}
.pill.pro{background:var(--gold);color:var(--navy)}
nav.tabs{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:25}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:6px;padding-bottom:6px}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;min-height:40px;border:0;background:transparent;border-radius:10px;padding:0 12px;font:600 14px/1 Figtree,sans-serif;color:var(--muted);cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--navy);color:var(--cream)}
main{padding:18px 0 30px}
h1{font:600 30px/1.15 "Cormorant Garamond",Georgia,serif;margin:0 0 6px}
h2{font:600 22px/1.2 "Cormorant Garamond",Georgia,serif;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.card.flat{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2;color:var(--navy)}
.ticker{background:var(--navy);color:var(--cream);border-radius:16px;padding:18px;margin:0 0 14px}
.ticker .big{font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--gold)}
button,.btn{min-height:44px;border-radius:10px;border:0;font:600 15px/1 Figtree,sans-serif;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.primary{background:var(--navy);color:var(--cream)}
.ghost{background:var(--paper);color:var(--navy);border:1px solid var(--line)}
.gold{background:var(--gold);color:var(--navy)}
.danger{background:transparent;color:var(--bad);border:1px solid #E7C3BE}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;padding:0;min-height:0;font-weight:600}
button:disabled{opacity:.55;cursor:default}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--navy)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:540px){.form-grid{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--gold-wash);color:#5C4A1E}
.tag.ok{background:#E2F2E8;color:var(--ok)}.tag.warn{background:#FBEBD3;color:var(--warn)}.tag.bad{background:#F8E1DE;color:var(--bad)}.tag.navy{background:var(--navy);color:var(--cream)}
.notice{border-left:4px solid var(--gold);background:var(--gold-wash);padding:10px 12px;border-radius:8px;font-size:14px;margin:0 0 12px}
.err{border-left-color:var(--bad);background:#F8E1DE}
.lock{position:relative;opacity:.9}
.list-item{border-top:1px solid var(--line);padding:10px 0}
.list-item:first-child{border-top:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:120px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.diagram{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:520px;height:auto}
.quiz-opt{display:block;width:100%;text-align:left;margin:6px 0;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:400;padding:10px 12px;min-height:48px;line-height:1.35}
.quiz-opt.right{border-color:var(--ok);background:#E2F2E8}.quiz-opt.wrong{border-color:var(--bad);background:#F8E1DE}
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);color:var(--cream);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.player .wrap{display:flex;align-items:center;gap:8px}
.player .now{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player button{min-height:44px;min-width:44px;background:rgba(255,255,255,.12);color:var(--cream)}
.player select{width:auto;min-height:40px;background:rgba(255,255,255,.12);color:var(--cream);border-color:rgba(255,255,255,.25)}
.modal{position:fixed;inset:0;background:rgba(18,28,56,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--cream);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
table.simple{width:100%;border-collapse:collapse;font-size:14px}
table.simple th,table.simple td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.resume-sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:28px 32px;font:14px/1.45 Calibri,Carlito,Arial,sans-serif}
.resume-sheet h1{font:700 24px/1.2 Calibri,Carlito,Arial,sans-serif;text-align:center;margin:0;color:#1B2951}
.resume-sheet .tagline{text-align:center;color:#1F6F78;font-weight:600;margin:2px 0}
.resume-sheet .contact{text-align:center;font-size:12.5px;margin-bottom:10px}
.resume-sheet h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#1B2951;border-bottom:2px solid #1F6F78;margin:14px 0 6px;padding-bottom:2px}
.resume-sheet ul{margin:4px 0 6px 18px;padding:0}
.resume-sheet .job{display:flex;justify-content:space-between;gap:8px;font-weight:700}

/* ---- app-style navigation ---- */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(27,41,81,.08)}
.bottom-nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px/1.1 Figtree,sans-serif;color:var(--muted);min-height:56px;padding:4px 0;border-radius:12px}
.bn-icon{width:30px;height:30px;display:block;filter:grayscale(1);opacity:.7}
.bn-icon svg{width:100%;height:100%}
.bottom-nav button[aria-current="page"]{color:var(--navy)}
.bottom-nav button[aria-current="page"] .bn-icon{filter:none;opacity:1;transform:scale(1.08)}
.player{bottom:calc(68px + env(safe-area-inset-bottom))!important;border-radius:14px 14px 0 0}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.center{text-align:center}.center-row{justify-content:center}
/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.small-tiles{grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:20px;padding:14px;min-height:150px;cursor:pointer;box-shadow:0 2px 0 rgba(27,41,81,.06);transition:transform .12s}
.small-tiles .tile{min-height:104px;align-items:center;text-align:center;padding:10px 6px}
.tile:active{transform:scale(.97)}
.tile-art{width:64px;height:64px;display:block}.small-tiles .tile-art{width:52px;height:52px}
.tile-art svg,.chip-art svg,.art svg{width:100%;height:100%;display:block}
.tile-title{font:700 17px/1.2 Figtree,sans-serif;color:var(--ink);margin-top:4px}.small-tiles .tile-title{font-size:14px}
.tile-sub{font-size:13px;color:var(--muted)}
.tile .badge{position:absolute;top:10px;right:10px;background:var(--navy);color:#fff;font:700 11px Figtree,sans-serif;border-radius:999px;padding:3px 8px}
.tile.sun{background:#FFF6DC}.tile.rose{background:#FDE8EA}.tile.sky{background:#E6F0FC}.tile.mint{background:#E2F4EE}.tile.sand{background:#F6EEDC}.tile.lav{background:#EFE8FA}
.tile.navy{background:var(--navy)}.tile.navy .tile-title{color:#fff}.tile.navy .tile-sub{color:#E6DDC8}.tile.navy .badge{background:var(--gold);color:var(--navy)}
/* ---- chips + points ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 6px;min-height:44px;font:600 14px Figtree,sans-serif;color:var(--ink);cursor:pointer}
.chip-art{width:30px;height:30px;display:block}.wis-chips .chip{padding:6px 14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.play-chip{background:var(--gold,#C9A227);border-color:var(--gold,#C9A227);color:var(--navy,#1B2951);padding:6px 16px}
.chip:not(:has(.chip-art)){padding:6px 14px}
.form-grid .chips{flex-wrap:wrap;overflow:visible}.check-chip input{width:18px;height:18px;margin:0;accent-color:var(--navy)}.check-chip:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy)}
span.label{display:block;font-weight:600;margin:0 0 6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin-top:8px}.kv span{display:block;color:var(--muted,#5b6475);font-size:12px}
.tlog{margin-top:8px;border-left:3px solid var(--gold,#C9A227);padding:2px 0 2px 10px;display:grid;gap:2px}
.pill.net{background:#E8F0FE;color:#0B2545;border:0;border-radius:999px;padding:4px 10px;font:600 12px Figtree,sans-serif;margin-right:6px;cursor:pointer}.pill.net.off{background:#FDECEA;color:#8A1C12}
details.itin summary,details.itin-card summary{cursor:pointer;min-height:44px;display:flex;align-items:center}details.itin{margin-top:6px}
details.itin summary::before,details.itin-card summary::before{content:'▸';margin-right:8px;color:var(--gold,#C9A227)}details[open].itin summary::before,details[open].itin-card summary::before{content:'▾'}details.itin summary::-webkit-details-marker,details.itin-card summary::-webkit-details-marker{display:none}details.itin summary,details.itin-card summary{list-style:none}
.job-card h3,.track-card h3{margin:0}
.xpbar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.xp-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.goal{display:inline-flex;gap:3px;margin-left:4px}.goal i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}.goal i.on{background:#2FA39A}
.feature{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;font:inherit;color:inherit}
.art.sm{width:64px;height:64px;flex:0 0 64px}.art.md{width:120px;height:120px;margin:0 auto 6px}.art.xl{width:min(62vw,240px);height:min(62vw,240px);margin:0 auto}
/* ---- back bar, progress ---- */
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}.backbar h1{flex:1;font-size:24px;margin:0}
.icon-btn{min-width:44px;font-size:26px;padding:0}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin:0;font-weight:600}.toggle input{width:20px;min-height:20px;height:20px}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#2FA39A,#C9A961);border-radius:999px;transition:width .3s}
/* ---- flashcards ---- */
.flash{background:#fff;border-radius:26px;box-shadow:0 10px 30px rgba(27,41,81,.12);padding:22px 18px;min-height:52vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;margin:10px 0;user-select:none;-webkit-tap-highlight-color:transparent}
.flash.flipped{background:var(--navy);color:var(--cream)}
.flash-title{font:600 28px/1.15 "Cormorant Garamond",Georgia,serif;margin-top:12px}.flash-title.sm{font-size:22px;color:var(--gold)}
.flash-body{font-size:19px;line-height:1.5;margin-top:10px}
.flash-hint{font-size:13px;opacity:.6;margin-top:14px}
.flash-actions{display:flex;justify-content:center;gap:14px}
.round{width:58px;height:58px;min-height:58px;border-radius:50%;padding:0;background:#fff;border:1px solid var(--line);color:var(--navy);font-size:26px;box-shadow:0 2px 6px rgba(27,41,81,.08)}
.round.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.round.saved{background:#FDE8EA;color:#D9534F;border-color:#F3C2C8}
.round:disabled{opacity:.35}
/* ---- quiz ---- */
.qcard{background:#fff;border-radius:22px;padding:16px;text-align:center;margin:10px 0;box-shadow:0 6px 18px rgba(27,41,81,.08)}
.qtext{font:700 20px/1.35 Figtree,sans-serif;margin:4px 0}
.quiz-opt.big{display:flex;align-items:center;gap:12px;border-radius:16px;min-height:60px;font-size:17px;margin:8px 0;padding:10px 14px}
.quiz-opt .letter{flex:0 0 34px;height:34px;border-radius:50%;background:var(--gold-wash);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700}
.quiz-opt.right .letter{background:#2FA39A;color:#fff}.quiz-opt.wrong .letter{background:#D9534F;color:#fff}.quiz-opt.dim{opacity:.55}
.feedback{border-radius:16px;padding:14px;margin:10px 0;font-size:16px}.feedback.ok{background:#E2F4EE}.feedback.no{background:#FDE8EA}
.wide{width:100%;min-height:56px;font-size:17px}
.done{text-align:center;padding-top:10px}.done h1{margin-top:6px}
.diag-card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.diagram.zoom svg{min-width:720px}
.rule{display:flex;gap:12px;align-items:flex-start}
.small-btn{min-height:36px;font-size:13px;padding:0 10px}
/* ---- wisdom feed ---- */
.wis-mini{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:20px;padding:14px;margin:0 0 12px;cursor:pointer;font:inherit;color:inherit}
.wis-mini-art{width:72px;height:72px;flex:0 0 72px}.wis-mini-art svg{width:100%;height:100%}
.wis-mini-title{display:block;font:600 22px/1.15 "Cormorant Garamond",Georgia,serif;margin:2px 0}
.wis-cat{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
body.feed-mode main{padding-top:6px;padding-bottom:0}
.wis-feed{height:calc(100dvh - 56px - 62px - 84px - env(safe-area-inset-bottom));overflow-y:auto;scroll-snap-type:y mandatory;border-radius:24px;scrollbar-width:none}
.wis-feed::-webkit-scrollbar{display:none}
.wis-card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:18px 78px 40px 22px;box-sizing:border-box;border-radius:24px;margin-bottom:10px;overflow:hidden}
.wis-art{width:min(48vw,200px,24dvh);height:min(48vw,200px,24dvh);margin-bottom:12px;flex:0 0 auto}.wis-art svg{width:100%;height:100%}
.wis-title{font:600 clamp(26px,4.4dvh,34px)/1.1 "Cormorant Garamond",Georgia,serif;margin:6px 0 10px}
.wis-body{font-size:clamp(16px,2.5dvh,19px);line-height:1.45;margin:0}
.wis-actions{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:12px}
.swipe-hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:var(--muted);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.play-fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:44;border-radius:999px;min-height:52px;padding:0 20px;box-shadow:0 6px 18px rgba(27,41,81,.25)}
@media (prefers-reduced-motion: reduce){.swipe-hint{animation:none}.tile{transition:none}}
[hidden]{display:none!important}
@media print{
  body{background:#fff;padding:0}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .resume-sheet{border:0;padding:0}
}
</style>
</head>
<body>
<header class="top">
<div class="wrap">
<a class="mark" href="../"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#C9A961" stroke-width="1.6"/><ellipse cx="20" cy="20" rx="8" ry="18" fill="none" stroke="#C9A961" stroke-width="1.3"/><path d="M2 20H38" stroke="#C9A961" stroke-width="1.3"/></svg>CONNECT</a>
<span class="row" style="gap:8px"><span id="langSlot"></span><span id="topRight"></span></span>
</div>
</header>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="wrap" id="tabList"></div></nav>
<main class="wrap" id="app" tabindex="-1"><p class="muted">Loading…</p></main>
<div class="player" id="player" hidden>
<div class="wrap">
<button type="button" id="plPlay" aria-label="Pause">❚❚</button>
<button type="button" id="plNext" aria-label="Skip">»</button>
<div class="now" id="plNow" aria-live="polite"></div>
<label for="plRate" style="position:absolute;left:-9999px">Speed</label>
<select id="plRate"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
<button type="button" id="plStop" aria-label="Stop">✕</button>
</div>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Main" hidden></nav>
<div id="printArea" aria-hidden="true"></div>
<script src="../i18n.js"></script>
<script src="config.js?v=5"></script>
<script src="qrcode.js"></script>
<script src="art.js"></script>
<script src="learn.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
